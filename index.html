<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Device Linker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="container glass-panel">
        <!-- View 1: Setup -->
        <div id="setup-view" class="view active">
            <h1 class="title">Sync<span class="highlight">Flow</span></h1>
            <p class="subtitle">Link your devices instantly</p>

            <div class="action-cards">
                <!-- PC Card -->
                <div class="card pc-card">
                    <div class="card-icon">🖥️</div>
                    <h3>Start Link (PC)</h3>
                    <p>Generate a QR and short code to link your phone.</p>
                    <button id="btn-create-room" class="btn primary-btn">Generate Code</button>
                    
                    <div id="qr-container" class="hidden">
                        <canvas id="qrcode"></canvas>
                        <div class="code-display">
                            <span class="label">Room Code:</span>
                            <span id="room-code-display" class="code-text">----</span>
                        </div>
                        <p class="status-text waiting">Waiting for device to connect...</p>
                    </div>
                </div>

                <!-- Mobile Card -->
                <div class="card mobile-card">
                    <div class="card-icon">📱</div>
                    <h3>Join Link (Mobile)</h3>
                    <p>Enter the 4-digit code shown on your PC.</p>
                    <div class="input-group">
                        <input type="number" id="input-room-code" placeholder="4-Digit Code" maxlength="4">
                        <button id="btn-join-room" class="btn secondary-btn">Connect</button>
                    </div>
                    <div id="join-error" class="error-msg hidden"></div>
                </div>
            </div>
        </div>

        <!-- View 2: Connected Chat -->
        <div id="chat-view" class="view hidden">
            <div class="chat-header">
                <h2>Connected Device</h2>
                <div class="connection-status">
                    <div class="dot active"></div>
                    <span>Linked</span>
                </div>
            </div>
            
            <div id="chat-messages" class="chat-messages">
                <div class="welcome-msg">You are now linked! Try sending a text.</div>
            </div>
            
            <div class="chat-input-area">
                <input type="file" id="input-file" class="hidden">
                <button id="btn-file" class="btn secondary-btn" style="width: auto; padding: 0 15px;" title="Send File">
                    📎
                </button>
                <input type="text" id="input-message" placeholder="Type a message or link..." autocomplete="off">
                <button id="btn-send" class="btn send-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
